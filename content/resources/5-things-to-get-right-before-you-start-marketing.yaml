title: 5 Things to Get Right Before You Start Marketing
category: Growth
excerpt: >-
  "5 Things to Get Right Before You Start Marketing" is for MSME founders
  who've watched an ad budget disappear into "reach" and "impressions" with
  nothing to show for it — arguing that marketing is a targeting decision, not
  a spend decision. It walks through the five fundamentals to nail before you
  spend a rupee, plus the A.B.C. framework (Audience, Belief, Cap) to run
  before every campaign.
pages: '10'
