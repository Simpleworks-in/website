headline: >-
  The owner’s day was over 120% full. Most decisions ran through him.
note: >-
  Industry and location changed to protect the client’s confidentiality.
problem: >-
  A family-run business with one owner and three managers, where almost
  everything still ran through the owner. By the owner’s own count of the
  minutes, his day was over 120% full, and he took 12 of the 21 regular
  decisions. Nothing about who owns what was written down.
solution: >-
  Over 60 days, we mapped the work task by task across a team of 14, using the
  owner’s own minutes. We wrote down who decides what, with limits for each
  person. We recommended six moves of work to people who had time, and named
  one owner for the customer after the order.
outcome: >-
  The six moves are bringing the owner’s day from over 120% to about 100%, and
  the decisions he takes himself from 12 to 7, without hiring anyone. With time
  back for the business, he is now focused on what comes next: growing revenue
  by 20% every quarter.
