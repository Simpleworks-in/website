problem: >-
  The client post working in 10 years in software startups in Bengaluru was
  looking for clarity on what business should he focus to launch as he had
  multiple ideas on what to launch
solution: >-
  We did a detailed analysis of his core strength and interest , looked at the
  top 5 business ideas he had brought to the table and mapped the oppotunity
  sizing of each and related to his core strengths . We were able to zero down
  on one idea of starting a design house focussed on deep tech business which he
  could work on . Given his background as a product manager and UX specialist it
  made a perfect fit .
