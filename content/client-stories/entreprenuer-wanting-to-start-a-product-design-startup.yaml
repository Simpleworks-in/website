imageAlt: Deep Tech Design Startup
problem: >-
  After ten years in software startups in Bangalore, the founder had several business ideas and needed to decide which one to build.
solution: >-
  We looked at what he is strongest at and most interested in, then sized the opportunity for each of the five ideas he brought. One fitted best: a design studio for deep-tech companies, which suits his background as a product manager and UX specialist.
headline: >-
  Five business ideas on the table. One worth building.
outcome: >-
  He changed his go-to-market to focus on mid-market companies, which offer more scope than MSMEs, and is now in talks with four or five mid-market product companies.
