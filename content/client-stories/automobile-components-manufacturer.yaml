problem: >-
  A founder-run business whose revenue had been flat for two years. It sold B2B and depended on two anchor customers.
solution: >-
  We reworked the go-to-market plan and mapped a much wider list of potential customers. We then opened the aftermarket channel, starting with a few good distributors in Bangalore on cash-and-carry, which eased cash flow. We also advised registering on Udyam, so B2B buyers come under the MSMED Act’s 45-day payment rule.
revenue: about ₹3 crore a year, flat for two years
outcome: >-
  New B2B customers are signing on beyond the two anchors, and the first
  aftermarket distributor is on board.
headline: >-
  Flat for two years, two clients carrying the business.
