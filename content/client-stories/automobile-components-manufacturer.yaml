problem: >-
  A founder-run business whose revenue had been stagnant for the past two
  years. It sold B2B and depended on two anchor clients.
solution: >-
  We reworked the go-to-market approach and mapped a much larger universe of
  potential customers. We then opened up the aftermarket channel, starting with
  a few good distributors in Bengaluru on a cash-and-carry basis, which eased
  the cash-flow pressure. We also advised enlisting on the Udyam portal, so
  that payments from B2B customers arrive within 45 days.
