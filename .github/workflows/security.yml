name: Security checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  gitleaks:
    name: Gitleaks secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # We install the gitleaks binary directly rather than using
      # gitleaks/gitleaks-action@v2, which requires a paid license for
      # GitHub Organization accounts. The binary itself is MIT-licensed
      # and free for any usage.
      - name: Install gitleaks
        run: |
          GITLEAKS_VERSION=8.21.2
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin gitleaks
          gitleaks version
      - name: Run gitleaks
        run: gitleaks detect --source . --no-banner --redact --verbose

  audit:
    name: pnpm audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # pnpm version comes from "packageManager" field in package.json
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: pnpm audit (high+, production only)
        run: pnpm audit --audit-level=high --prod

  typecheck-build:
    name: Type check + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # pnpm version comes from "packageManager" field in package.json
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # next build emits .next/dev/types which strict tsc relies on for
      # static image imports. Build first, then re-check types.
      - name: Next.js build
        run: pnpm build
        env:
          NEXT_PUBLIC_GA_ID: ""
          NEXT_PUBLIC_FORMSPREE_ID: ""
          NEXT_PUBLIC_CALENDAR_EMBED_URL: ""
      - name: TypeScript strict check
        run: pnpm exec tsc --noEmit
